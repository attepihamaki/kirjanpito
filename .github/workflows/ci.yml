# Runs the same checks as the deploy on every pull request, so a change is
# known to pass before it is merged. Branches without a pull request, Claude's
# included, are not checked until one is opened.
name: CI

on:
  pull_request:

permissions:
  contents: read

# A newer commit on the same pull request makes the running check obsolete.
concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup # zizmor: ignore[self-repository]

      # typecheck, formatting, lint, docs pointers, unused code and unit tests
      - run: npm run check

      # The same key as deploy.yml, so a pull request starts from main's cache.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('app/**', 'components/**', 'hooks/**', 'lib/**', 'stores/**', 'next.config.ts') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      # `postbuild` verifies the export, including the CSP.
      - run: npm run build
