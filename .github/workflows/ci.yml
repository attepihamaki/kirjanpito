# Runs the same checks as the deploy, on every pull request and on every push
# to a Claude branch, so a change is known to pass before it is merged.
#
# Claude's pull requests are opened by the workflow token, and GitHub starts
# no workflow for a pull request that token opens. The push trigger on
# `claude/**` covers them instead: the result attaches to the branch's head
# commit and shows on the pull request. The pull request trigger skips those
# branches so each commit is checked once.
name: CI

on:
  pull_request:
  push:
    branches: ["claude/**"]

permissions:
  contents: read

# A newer commit on the same branch makes the running check obsolete.
concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event_name == 'push' || !startsWith(github.head_ref, 'claude/')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # typecheck, formatting, lint, docs pointers, unused code and unit tests
      - run: npm run check

      # `postbuild` verifies the export, including the CSP.
      - run: npm run build
