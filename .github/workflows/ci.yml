# Runs the same checks as the deploy, on every pull request and on every push
# to a Claude branch, so a change is known to pass before it is merged.
#
# Claude's branches are checked on push. Their pull requests are opened by the
# workflow token, and GitHub holds a pull request run that token starts for
# approval; the push run attaches its result to the same head commit, so it
# shows on the pull request without one. The pull request trigger skips those
# branches so each commit is checked once.
#
# `workflow_dispatch` checks a branch on demand, when that branch's copy of
# this file has the trigger; an older branch is brought up to date with `gh
# pr update-branch <number>`, whose push starts the check as well:
#   gh workflow run ci.yml --ref <branch>
name: CI

on:
  pull_request:
  push:
    branches: ["claude/**"]
  workflow_dispatch:

permissions:
  contents: read

# A newer commit on the same branch makes the running check obsolete.
concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'claude/')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # typecheck, formatting, lint, docs pointers, unused code and unit tests
      - run: npm run check

      # The same key as deploy.yml, so a pull request starts from main's cache.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('app/**', 'components/**', 'hooks/**', 'lib/**', 'stores/**', 'next.config.ts') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      # `postbuild` verifies the export, including the CSP.
      - run: npm run build
