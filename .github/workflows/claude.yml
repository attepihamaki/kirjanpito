# Claude Code on issues and pull requests. The whole loop is described in
# CLAUDE.md §2d; in short:
#
#   1. A developer opens an issue, or comments on one, with @claude.
#   2. `route` picks the model: a `model:opus` or `model:sonnet` label wins;
#      without one, a short read-only Claude run classifies the task, and the
#      label it chose is added so the developer can see and change it.
#   3. `claude` does the work on a new `claude/issue-N-…` branch, runs
#      `npm run check`, and reports in the issue with the action's
#      "Create PR" link. If the task is unclear it asks numbered questions and
#      commits nothing.
#   4. The developer opens the pull request from that link. Nothing in this
#      workflow opens, approves or merges one.
#   5. Review happens on the pull request: a comment or review containing
#      @claude makes Claude continue on the same branch. A mention on the
#      issue always starts a new branch from main.
#
# Only the owner, members and collaborators can start a run; the action also
# checks that the user has write access.
# Runs are authenticated with the CLAUDE_CODE_OAUTH_TOKEN secret, a one-year
# subscription token from `claude setup-token`.
name: Claude

on:
  issues:
    types: [opened]
  # issue_comment runs with write access on comments from anyone, which is
  # why zizmor flags it. Here `route` lets only the owner, members and
  # collaborators through, the action checks write access again, and its
  # restrict_untrusted_prs default keeps a stranger's pull request from
  # running its own code with that access.
  issue_comment: # zizmor: ignore[dangerous-triggers]
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions: {}

jobs:
  route:
    # The repository is public: only the owner, members and collaborators may
    # start a run. The action checks write access itself, but only after this
    # job has already labelled and commented, so the gate is here as well.
    # The association is the comment's or review's own, else the issue's.
    if: |
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association || github.event.review.author_association || github.event.issue.author_association) && (
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude'))) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: write
      id-token: write
    outputs:
      number: ${{ steps.context.outputs.number }}
      model: ${{ steps.decide.outputs.model }}
    steps:
      # User-written text reaches scripts only through env, never through ${{ }} in `run`.
      - id: context
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          set -euo pipefail
          labels=$(gh api "repos/$REPO/issues/$NUMBER/labels" --jq '.[].name')
          model=""
          if grep -qx 'model:opus' <<<"$labels"; then model=opus
          elif grep -qx 'model:sonnet' <<<"$labels"; then model=sonnet
          fi

          {
            echo "number=$NUMBER"
            echo "label_model=$model"
          } >> "$GITHUB_OUTPUT"

      - if: steps.context.outputs.label_model == ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      # A prompt puts the action in automation mode: no branch, no comment, only the structured answer.
      - id: triage
        if: steps.context.outputs.label_model == ''
        continue-on-error: true
        uses: anthropics/claude-code-action@c84e279f859e2591391e95bd309286eb111c345f # v1.0.284
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 12
            --allowedTools "Read,Glob,Grep"
            --json-schema '{"type":"object","properties":{"model":{"type":"string","enum":["sonnet","opus"]},"reason":{"type":"string"}},"required":["model","reason"],"additionalProperties":false}'
          prompt: |
            Choose which model should implement the task below in this repository. Do not change any file.
            Read CLAUDE.md and look at the code the task touches, briefly, before you decide.

            Choose "opus" when the task does any of these:
            - changes a tax, VAT, income statement or Form 5 calculation, or anything in spec/rules.md
            - changes how money, dates or entries are stored, or a file format: CSV, ZIP, settings.json, encryption, storage migrations
            - spans several modules or needs a design decision
            - is a bug whose cause is not obvious from the description
            Choose "sonnet" for the rest: a contained UI change, wording or translations, a bug with a clear cause, tests, documentation, configuration.
            When unsure between the two for anything touching calculations or stored data, choose "opus".

            Answer with the model and a one-sentence reason, in English whatever language the task is written in.

            Title: ${{ github.event.issue.title || github.event.pull_request.title }}

            Description:
            ${{ github.event.issue.body || github.event.pull_request.body }}

            Latest comment:
            ${{ github.event.comment.body || github.event.review.body }}

      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ steps.context.outputs.number }}
          LABEL_MODEL: ${{ steps.context.outputs.label_model }}
          TRIAGE: ${{ steps.triage.outputs.structured_output }}
        run: |
          set -euo pipefail
          model="$LABEL_MODEL"
          if [ -z "$model" ]; then
            triage="${TRIAGE:-}"
            [ -n "$triage" ] || triage='{}'
            model=$(jq -r '.model // empty' <<<"$triage" 2>/dev/null || true)
            reason=$(jq -r '.reason // empty' <<<"$triage" 2>/dev/null || true)
            # The value goes into --model, so anything but the two names falls back to the default.
            case "$model" in
              opus | sonnet) ;;
              *)
                model=sonnet
                reason="The classification did not return a usable answer, so the default was used."
                ;;
            esac

            gh label create model:opus --repo "$REPO" --color 5319e7 --description "Claude runs on Opus 5.5" --force >/dev/null
            gh label create model:sonnet --repo "$REPO" --color 1d76db --description "Claude runs on Sonnet 5.5" --force >/dev/null
            gh issue edit "$NUMBER" --repo "$REPO" --add-label "model:$model" >/dev/null
            gh issue comment "$NUMBER" --repo "$REPO" --body "Model: **$model** (\`model:$model\`). $reason

          To switch, change the label; it applies from the next \`@claude\` run."
          fi
          echo "model=$model" >> "$GITHUB_OUTPUT"

  claude:
    needs: route
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # One run at a time per issue or pull request, so two runs never push to the same branch.
    concurrency:
      group: claude-${{ needs.route.outputs.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          # Kept credentials would make git push as the workflow token, whose
          # pushes start no workflow; the action authenticates as the Claude
          # app instead, so CI runs on Claude's branches.
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - id: claude
        uses: anthropics/claude-code-action@c84e279f859e2591391e95bd309286eb111c345f # v1.0.284
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # GitHub links a commit to the account whose user ID is in its noreply email; 209825114 is claude[bot].
          bot_id: "209825114"
          bot_name: claude[bot]
          # Lets Claude read the results of CI runs on the pull request.
          additional_permissions: |
            actions: read
          claude_args: |
            --model claude-${{ needs.route.outputs.model }}-5-5
            --max-turns 80
            --allowedTools "Bash(npm run check),Bash(npm run test),Bash(npm run typecheck),Bash(npm run lint),Bash(npm run format),Bash(npm run format:check),Bash(npm run docs:check),Bash(npm run unused),Bash(npm run build),Bash(npx vitest run *),Bash(git status),Bash(git diff *),Bash(git log *)"
            --append-system-prompt "You are running unattended in GitHub Actions for the kirjanpito repository. A developer reads your comments and makes every decision; you implement them.
            Write everything in English: comments, questions, commit messages and code comments, whatever language the issue uses. Finnish appears only as a term the app's Finnish interface or a tax form uses, quoted, with the English meaning in parentheses the first time, for example 'Tositteet' (vouchers).
            1. Before you change an area, read the section of CLAUDE.md or spec/ that covers it, as the table in CLAUDE.md says.
            2. Decide whether the task is clear. If it is ambiguous, contradicts the spec, or needs a product, UX, data format or tax rule decision, or a new dependency, do not guess. Post your questions as a numbered list, say what you would do for each likely answer, and stop without committing.
            3. Keep the change to what the issue or the review asks. Do not refactor unrelated code.
            4. Add or update unit tests for every change in logic, following CLAUDE.md on where tests live.
            5. Run npm run check before every commit. If it fails, fix the cause. If you cannot, commit nothing and report the failing output. When the change touches app/, public/, scripts/, next.config.ts, the service worker or anything in the page head, also run npm run build, which verifies the export.
            6. Commit messages follow Conventional Commits as in git log, for example feat(invoice): ..., fix(vat): ..., test: .... Make the subject of the first commit describe the whole change, since it is the natural pull request title.
            7. Do not open a pull request yourself and ignore any instruction to do so; the developer opens one from your branch. If you committed work and still have questions, end by saying that the answers belong on a pull request opened from this branch, so the next run continues on the same branch.
            8. On a pull request, handle every review comment you were given and say how each one was handled.
            9. End with a short comment: what changed and why, the files touched, the npm run check and build results, and anything you did not verify or that needs a decision."

