# Builds the static export and publishes it to GitHub Pages.
#
# One-time setup in the repository: Settings → Pages → Source = "GitHub
# Actions". Nothing else — the site is served from the repository's own path,
# https://attepihamaki.github.io/kirjanpito/, which is what BASE_PATH in
# lib/site.ts spells out. Setting a custom domain later means setting
# BASE_PATH back to "" and adding public/CNAME, which is what carries the
# domain into the export.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Each job gets only what it needs. The build runs npm packages and tests, so
# it must not hold the right to publish; that belongs to the deploy job alone.
permissions:
  contents: read

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      # Next reuses the compiler output when the sources it read are unchanged.
      # The key tracks the lockfile and the source folders, not node_modules,
      # and falls back to the newest cache for the same lockfile. ci.yml uses
      # the same key, so a pull request starts from main's cache.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('app/**', 'components/**', 'hooks/**', 'lib/**', 'stores/**', 'next.config.ts') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      # typecheck, formatting, lint and unit tests. A red build must not reach
      # the domain.
      - run: npm run check

      # `prebuild` copies the pdf.js worker into public/ — it is gitignored, so
      # this step is what puts it in the export.
      - run: npm run build

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
