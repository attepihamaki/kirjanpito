# Builds the static export and publishes it to GitHub Pages.
#
# One-time setup in the repository: Settings → Pages → Source = "GitHub
# Actions". Nothing else — the site is served from the repository's own path,
# https://attepihamaki.github.io/kirjanpito/, which is what BASE_PATH in
# lib/site.ts spells out. Setting a custom domain later means setting
# BASE_PATH back to "" and adding public/CNAME, which is what carries the
# domain into the export.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # typecheck + lint + unit tests. A red build must not reach the domain.
      - run: npm run check

      # `prebuild` copies the pdf.js worker into public/ — it is gitignored, so
      # this step is what puts it in the export.
      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
