# Keeps one issue open while any Claude token expires within 30 days. A token
# from `claude setup-token` lasts one year, and @claude stops working for its
# owner once it has expired (CLAUDE.md §2d).
#
# The expiry dates are the `expires` fields of the CLAUDE_USERS variable,
# which scripts/claude-users.sh writes when it adds or renews a token. The
# issue mentions everyone who has to renew, is updated every week, and is
# closed once no token expires within 30 days.
name: Claude token reminder

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      USERS: ${{ vars.CLAUDE_USERS }}
      TITLE: Claude tokens expiring soon
    steps:
      - name: Open, update or close the issue
        run: |
          set -euo pipefail
          if ! jq -e 'type == "array"' <<<"${USERS:-[]}" >/dev/null 2>&1; then
            echo "::error::The CLAUDE_USERS variable is not a JSON array."
            exit 1
          fi
          if [ "$(jq 'length' <<<"${USERS:-[]}")" = 0 ]; then
            echo "::warning::CLAUDE_USERS is empty. Add tokens with scripts/claude-users.sh add."
            exit 0
          fi

          # An entry without a valid date can never be reminded about, so it fails the run.
          bad=$(jq -r 'map(select((.expires // "") | test("^[0-9]{4}-[0-9]{2}-[0-9]{2}$") | not)) | map(.github // "?") | join(", ")' <<<"$USERS")
          if [ -n "$bad" ]; then
            echo "::error::CLAUDE_USERS has no valid expires date (YYYY-MM-DD) for: $bad"
            exit 1
          fi

          limit=$(date -u -d '+30 days' +%F)
          list=$(jq -r --arg limit "$limit" '
            map(select(.expires <= $limit))
            | sort_by(.expires)
            | .[]
            | "- [ ] @\(.github): `CLAUDE_TOKEN_\(.secret)` expires **\(.expires)**"' <<<"$USERS")
          existing=$(gh issue list --repo "$REPO" --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number // empty')

          if [ -z "$list" ]; then
            echo "No Claude token expires before $limit."
            if [ -n "$existing" ]; then
              gh issue close "$existing" --repo "$REPO" --comment "Every Claude token is now valid for more than 30 days."
            fi
            exit 0
          fi

          body=$(cat <<EOF
          These Claude tokens expire within 30 days. Once a token has expired, @claude stops working for its owner.

          $list

          To renew:
          1. The owner runs \`claude setup-token\` on their own machine and gives the new token to a repository admin through the password manager.
          2. The admin runs \`scripts/claude-users.sh add <github-login> -R $REPO\`, which replaces the secret and records the new expiry date.

          This issue is updated every Monday and closes itself once every token is renewed. See \`.github/claude-github-actions.md\`.
          EOF
          )
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --repo "$REPO" --body "$body"
          else
            gh issue create --repo "$REPO" --title "$TITLE" --body "$body"
          fi
