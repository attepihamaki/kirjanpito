# Checks the workflows themselves whenever something under .github/ changes:
#
#   actionlint  syntax, expressions, and the shell in `run` steps (shellcheck)
#   zizmor      security: credentials, permissions, injection, cache poisoning
#
# Both are pinned, actionlint by image digest and zizmor by version; Dependabot
# updates the zizmor action, and a new tool version is a deliberate change.
name: Workflow lint

on:
  pull_request:
    paths: [".github/**"]
  push:
    branches: [main]
    paths: [".github/**"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: workflow-lint-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color

  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Findings go to the log and as annotations on the pull request, not to code scanning.
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: 1.32.0
          advanced-security: false
          annotations: true
