# Publishes a GitHub release with notes built from the Conventional Commit
# subjects since the previous tag (scripts/release-notes.mjs).
#
# To make a release: tag a commit on main and push the tag.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# The deploy workflow publishes the site on every push to main whether or not a
# tag exists, so a release is a record of what changed, not a deployment.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # The notes read the history back to the previous tag.
          fetch-depth: 0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24

      - name: Build the notes
        run: node scripts/release-notes.mjs --to "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" > notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md
