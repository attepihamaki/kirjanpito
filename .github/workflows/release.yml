# Publishes a GitHub release with notes built from the Conventional Commit
# subjects since the previous tag (scripts/release-notes.mjs).
#
# To make a release: tag a commit on main and push the tag.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# The deploy workflow publishes the site on every push to main whether or not a
# tag exists, so a release is a record of what changed, not a deployment.
name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The notes read the history back to the previous tag.
          fetch-depth: 0
          persist-credentials: false

      # A release restores no cache: one written by another run could change what it publishes.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Build the notes
        run: node scripts/release-notes.mjs --to "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" > notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md
