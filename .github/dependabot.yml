# Weekly updates for the pinned actions and the npm packages. Every update
# pull request runs the CI workflow like any other.
#
# The cooldown proposes a release only after it has been out for a while, so
# a hijacked release is usually caught and pulled before it reaches here.
# Security updates are not delayed by it.
version: 2
updates:
  # The composite action in .github/actions/ pins setup-node too, so its folder is watched as well.
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: build(ci)

  # Minor and patch updates arrive as one pull request; a major update comes
  # on its own, since it may need code changes.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    # typescript-eslint, which lint runs on, supports TypeScript below 6.1 only, so a major TypeScript update breaks `npm run check`. Remove this once typescript-eslint supports the next major.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 5
    commit-message:
      prefix: build(deps)
